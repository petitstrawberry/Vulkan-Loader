[package]
name = "scarlet-vulkan-loader"
version = "1.4.365"
edition = "2024"
license = "Apache-2.0"
build = "build.rs"

[workspace]

[lib]
name = "vulkan"
crate-type = ["cdylib"]

[dependencies]
scarlet-libc = { git = "https://github.com/petitstrawberry/scarlet-sdk", rev = "e393a33e576ca0d4be8cbb947748a4975405a91f" }

[build-dependencies]
bindgen = "0.72"
syn = { version = "2", features = ["full"] }
quote = "1"

[profile.release]
panic = "abort"
lto = false
codegen-units = 1
